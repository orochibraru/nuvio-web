# Prose lint for the docs, run by the `vale` prek hook. `typos` owns spelling,
# markdownlint owns Markdown structure : Vale only judges the writing.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Nuvio

# Pinned release, not the floating package name: a style bump is a diff.
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google

# typos already does spelling, without a dictionary of every package name.
Vale.Spelling = NO

# House style, not mistakes: spaced em dashes, no Oxford comma, punctuation
# outside quotes, and code-ish tokens (`60s`, `MP4:`) the prose rules misread.
Google.EmDash = NO
Google.OxfordComma = NO
Google.Quotes = NO
Google.Units = NO
Google.Colons = NO
