# Runs linters, test suites & formatters
name: Tests

on:
  workflow_call:

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run sync

      - name: Unit tests + coverage (server / remote layer)
        run: bun run test:unit:coverage

  e2e:
    name: Playwright (e2e)
    runs-on: ubuntu-latest
    env:
      NUVIO_TEST_EMAIL: ${{ secrets.NUVIO_TEST_EMAIL }}
      NUVIO_TEST_PASSWORD: ${{ secrets.NUVIO_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run sync

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run e2e
        run: bun run test:e2e

      - uses: orochibraru/upload-artifact@aeca548ce375fd719f0400e020a3ad90509632bc # v8.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
