name: PR Title
# Squash merges use the PR title as the commit subject, which is what
# releaser reads to decide the next version.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  semantic:
    name: Semantic PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if ! grep -Eq "$pattern" <<<"$TITLE"; then
            echo "::error::PR title '$TITLE' is not a Conventional Commit, e.g. 'feat(player): pick the audio track' or 'fix: …'."
            exit 1
          fi
          echo "OK: $TITLE"
