name: Pull Request
on:
  pull_request:

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read
  packages: write

jobs:
  code_quality:
    name: Code Quality
    uses: ./.github/workflows/code_quality.yml

  build:
    name: Docker Build (App)
    needs: [code_quality]
    uses: ./.github/workflows/docker.yml
    with:
      image_tag: pr-${{ github.event.pull_request.number }}
      image_name: orochibraru/nuvio-web
      registry_name: hub.docker.com
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  gate:
    name: CI Gate
    if: always()
    needs: [code_quality, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=("${{ needs.code_quality.result }}" "${{ needs.build.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All checks passed (skipped jobs are OK)"
