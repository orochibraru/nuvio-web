      #     identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')"
      #     if [ -z "$identity" ]; then
      #       echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
      #       exit 1
      #     fi
      #     echo "ELECTROBUN_DEVELOPER_ID=$identity" >> "$GITHUB_ENV"
      # Signing is commented out until there's an Apple Developer account
