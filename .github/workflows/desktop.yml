      #     }
      #     Remove-Item $pfx

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuvio-web-desktop-${{ matrix.target }}
          path: desktop/artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to ${{ inputs.release-tag }}
    needs: [build]
    if: inputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuvio-web-desktop-*
          path: artifacts
          merge-multiple: true

      # The installers and, for the updater, each target's update.json and
      # archive. Their names carry the platform, so the targets never collide.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run:
          gh release upload "$TAG" artifacts/* --clobber --repo
          "$GITHUB_REPOSITORY"
