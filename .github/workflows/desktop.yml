# Builds the desktop app on every platform it ships for. Hutch only builds for
# the machine it runs on, so each target gets its own native runner. Called
# with a release tag (Publish, on a stable release), it attaches every build to
# that release, where the app's updater looks for them.
name: Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "package.json"
      - "bun.lock"
      - "static/icon-*.png"
      - ".github/workflows/desktop.yml"
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "package.json"
      - "bun.lock"
      - "static/icon-*.png"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: The release to attach the builds to
        type: string
        required: true

concurrency:
  group:
    desktop-${{ inputs.release-tag || github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
          - target: macos-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win-x64
            runner: windows-latest
    # # Signing runs only where the secrets are: a fork's PR builds unsigned.
    # env:
    #   MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    #   WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run sync

      # The Electrobun SDK the shell's types come from; `bun install` above
      # skips the `prepare` script that fetches it.
      - name: Prepare Electrobun
        working-directory: desktop
        run: bunx electrobun prepare

      - name: Type-check the desktop shell
        run: bun check -p desktop

