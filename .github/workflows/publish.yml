name: Publish
on:
  push:
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read
  packages: write

jobs:
  code_quality:
    name: Code Quality
    uses: ./.github/workflows/code_quality.yml

  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  version:
    name: Compute Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Dry-run release to compute the next version
        id: compute
        run: |
          output="$(bun run semantic-release --dry-run 2>&1)" || true
          echo "$output"
          version="$(echo "$output" | grep -oE 'release version is [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1)"
          if [ -n "$version" ]; then
            echo "This push will release v$version, tagging images accordingly."
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "No release-worthy commits, falling back to the commit SHA for image tags"
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Docker Build (App)
    uses: ./.github/workflows/docker.yml
    needs: [code_quality, tests, version]
    with:
      image_tag: ${{ needs.version.outputs.tag }}
      image_name: orochibraru/nuvio-web
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-app]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # RELEASE_TOKEN (a fine-grained PAT scoped to just this repo, Contents +
      # Issues + Pull requests: write) is required, not the default
      # GITHUB_TOKEN: the `main` ruleset blocks direct pushes from anyone but
      # a repo admin, and the default token's actor (github-actions[bot]) isn't
      # on the bypass list. Used both for git's push auth here and as GH_TOKEN
      # below for @semantic-release/github's API calls.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bun run release
