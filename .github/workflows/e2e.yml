# Runs the Playwright suite against the real Nuvio API with the test account
name: E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (e2e)
    runs-on: ubuntu-latest
    env:
      NUVIO_TEST_EMAIL: ${{ secrets.NUVIO_TEST_EMAIL }}
      NUVIO_TEST_PASSWORD: ${{ secrets.NUVIO_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run sync

      # The image's base layers come from Docker Hub, which rate-limits CI.
      # mirror.gcr.io does not; misses fall back.
      - name: Pull Docker Hub images through mirror.gcr.io
        run: |
          set -euo pipefail
          config=/etc/docker/daemon.json
          current="$(sudo cat "$config" 2>/dev/null || echo '{}')"
          jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' <<<"$current" \
            | sudo tee "$config" >/dev/null
          sudo systemctl restart docker

      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key:
            playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # The cache holds the browser, not the apt packages it links against.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # A fork PR gets no secrets, so only the specs that never sign in can run.
      - name: Run e2e
        env:
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$FORK" = "true" ]; then
            mapfile -t specs < <(grep -LE "signIn|NUVIO_TEST" e2e/*.spec.ts)
            bun run test:e2e "${specs[@]}"
          else
            bun run test:e2e
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
