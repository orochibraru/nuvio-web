on:
  push:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  trigger-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.DOCS_TRIGGER_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/orochibraru/orochibraru/dispatches \
            -d '{"event_type":"docs-update"}'
