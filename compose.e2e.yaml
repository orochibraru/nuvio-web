# The production image, as published, the way `playwright.config.ts` runs it.
name: nuvio-e2e

services:
  app:
    build:
      context: .
    container_name: nuvio-e2e
    network_mode: bridge
    ports:
      - 3000:3000
    environment:
      NUVIO_E2E: "1"
      NUVIO_ADMIN_EMAILS: ${NUVIO_ADMIN_EMAILS:-}
      NUVIO_SESSION_SECRET: ${NUVIO_SESSION_SECRET:-}
