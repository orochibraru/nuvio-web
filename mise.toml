[tasks.install]
description = "Build the desktop app from this checkout and install it (macOS)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname -s)" != "Darwin" ]; then
  echo "mise run install only installs on macOS for now: build with 'bun run build:desktop' and run the installer in desktop/artifacts." >&2
  exit 1
fi
bun install --frozen-lockfile
unpacked="$PWD/desktop/build/unpacked"
rm -rf "$unpacked"
# desktop/scripts/post-build.ts moves the app there and fails the build on
# purpose, before Hutch compresses it.
NUVIO_UNPACKED_DIR="$unpacked" bun run build:desktop || true
app="$(find "$unpacked" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
if [ -z "$app" ]; then
  echo "No app in $unpacked: the build failed before post-build.ts." >&2
  exit 1
fi
name="$(basename "$app")"
osascript -e "quit app \"${name%.app}\"" 2>/dev/null || true
rm -rf "/Applications/$name"
ditto "$app" "/Applications/$name"
# ditto carries extended attributes over: a quarantine flag picked up anywhere
# in the build (a downloaded mpv, a copied file) would make Gatekeeper refuse
# the unsigned app. A read-only file (mpv's libMoltenVK) makes xattr fail even
# with no flag on it: the check below is what decides.
xattr -r -d com.apple.quarantine "/Applications/$name" 2>/dev/null || true
if xattr -lr "/Applications/$name" | grep -q com.apple.quarantine; then
  echo "/Applications/$name is still quarantined." >&2
  exit 1
fi
echo "Installed /Applications/$name"
'''
