# Project vocabulary for `typos`, run as a pre-commit hook.

[files]
extend-exclude = [
	# Verbatim copies of external documents : upstream's typos are upstream's,
	# and rewriting them makes `bun run nuvio:check` diff our edits forever.
	"introdb-openapi.yaml",
	"src/lib/nuvio/nuvio-public-api.snapshot.md",
	# Generated by semantic-release from commit subjects, and full of
	# abbreviated commit SHAs that read as misspelled words.
	"CHANGELOG.md",
	# Vendored, pinned by skills-lock.json.
	".agents/",
]

[default.extend-words]
# "Reacher" the show : a fixture across the watch-provider tests.
reacher = "reacher"
Reacher = "Reacher"
# ISO 639-2 language codes, not words.
fre = "fre"
# A real variant spelling, used deliberately in the spec parser's warning.
unparseable = "unparseable"
