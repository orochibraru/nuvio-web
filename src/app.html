<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="text-scale" content="scale">
		<script>"use strict";
			// Paint the cached accent / AMOLED before first render : no flash.
			(() => {
				try {
					const t = JSON.parse(localStorage.getItem("nuvio:theme") || "{}");
					const r = document.documentElement;
					if (t.accent) {
						r.dataset.accent = t.accent;
					}
					r.dataset.amoled = String(t.darkStyle === "amoled");
				} catch {
					/* storage unavailable */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
