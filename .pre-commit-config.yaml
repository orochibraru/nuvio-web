# Run by prek (https://github.com/j178/prek), a drop-in pre-commit runner.
# `bun install` installs every shim listed below (`prek install`).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: Look for merge conflicts

      - id: check-case-conflict
        name: Look for case conflicts

      - id: detect-private-key
        name: Look for private keys

      - id: check-yaml
        name: Validate YAML

      - id: mixed-line-ending
        name: Fix line endings
        args: [--fix=lf]
        # Verbatim copies of external documents and generated files:
        # reformatting them makes `bun run nuvio:check` diff our own whitespace
        # forever, and every regeneration a diff.
        exclude: &generated |-
          (?x)^(
            src/lib/nuvio/nuvio-public-api\.snapshot\.md|
            introdb-openapi\.yaml|
            \.agents/|
            CHANGELOG\.md|
            bun\.lock
          )

      - id: end-of-file-fixer
        name: Fix end of files
        exclude: *generated

      - id: trailing-whitespace
        name: Fix trailing whitespaces
        args: [--markdown-linebreak-ext=md]
        exclude: *generated

  # semantic-release computes the next version from the commit messages, so a
  # malformed subject silently costs a release rather than failing loudly.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: Ensure conventional commits
        stages: [commit-msg]

  # Scans the *staged* diff, so it is a no-op under `--all-files` in CI.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Look for hardcoded secrets

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.2
    hooks:
      - id: typos
        name: Look for typos
        # Report, do not rewrite: the upstream default is --write-changes.
        # Project vocabulary lives in `_typos.toml`.
        args: [--force-exclude]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions

  - repo: local
    hooks:
      - id: pinact
        name: Pin GitHub Actions
        entry: pinact run
        language: golang
        language_version: 1.27.1
        additional_dependencies:
          [github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.0]
        files: ^\.github/workflows/.*\.ya?ml$

  # The Docker image, not the system binary: CI runners have a daemon but no
  # hadolint on PATH. Rule exemptions and their reasons are in `.hadolint.yaml`.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        name: Lint Docker

  # Binaries straight from node_modules/.bin: `bunx` re-resolves the package on
  # every invocation, which is most of what made the old hooks slow.
  - repo: local
    hooks:
      # Runs first: nuvio-public-api.json is generated from the committed prose
      # snapshot, which may itself be part of this commit. `nuvio:check` is not a
      # hook : it fetches the live upstream page, so it belongs in CI.
      - id: nuvio-spec
        name: Regenerate the Nuvio OpenAPI spec
        entry: bun run nuvio:spec
        language: system
        pass_filenames: false
        files: ^(src/lib/nuvio/nuvio-public-api\.snapshot\.md$|scripts/build-nuvio-spec\.ts$|scripts/nuvio-spec/)

      - id: biome
        name: Lint, format and sort imports (Biome)
        entry:
          node_modules/.bin/biome check --write --unsafe
          --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        require_serial: true
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css|svelte|html)$

      - id: format-md
        name: Formatting (Markdown, YAML)
        entry: node_modules/.bin/prettier --log-level warn --write
        language: system
        types_or: [markdown, yaml]

      - id: markdownlint
        name: Markdown lint
        entry: node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]

      # tailwint discards explicit file arguments (any path/glob form reports
      # "0 files scanned"), so it always scans the whole repo. Only the decision
      # to run it at all is staged-scoped.
      - id: lint-tailwind
        name: Lint (Tailwind)
        entry: node_modules/.bin/tailwint --fix
        language: system
        pass_filenames: false
        files: \.(svelte|html|css)$

      - id: lockfile-in-sync
        name: Make sure bun.lock matches package.json
        entry: bun install --frozen-lockfile --dry-run
        language: system
        pass_filenames: false
        files: ^(package\.json|bun\.lock)$

      # Whole-project by nature (a change in one file can break the types of a
      # file that imports it), so the paths only decide whether it runs at all.
      - id: check
        name: Type check
        entry: bun run check
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/|e2e/|scripts/|vite\.config\.ts$|tsconfig\.json$|package\.json$)

      - id: test-unit
        name: Unit tests
        entry: bun run test:unit
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/|scripts/|vitest\.config\.ts$)

  # The CLAUDE.md conventions no linter knows about. Each is at zero occurrences
  # today: guards against regression, not a cleanup backlog.
  - repo: local
    hooks:
      - id: no-thrown-redirect
        name: "Make sure redirect() / error() are called bare, not thrown"
        language: pygrep
        entry: \bthrow\s+(redirect|error)\s*\(
        files: \.(ts|svelte)$

      - id: no-dollar-lib
        name: "Look for $lib imports (SvelteKit 3 uses #lib/)"
        language: pygrep
        entry: |-
          ["']\$lib[/"']
        files: \.(ts|svelte)$

      - id: lib-imports-end-js
        name: "Make sure #lib/... specifiers end .js"
        language: pygrep
        entry: |-
          ["']#lib/[^"']*\.ts["']
        files: \.(ts|svelte)$

      - id: internal-links-resolve
        name: "Make sure all paths are resolved"
        language: pygrep
        entry: href="/
        files: \.svelte$
